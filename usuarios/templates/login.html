{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AprovaIFPI - Login</title>
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
    <link rel="stylesheet" href="{% static 'styles/login.css' %}">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body style="margin:0; padding:0; width:100%; height:100%;">
    <main class="w-100 h-100">
      <div class="container-fluid h-100">
        <div class="row vh-100">
          <div
            class="col-lg-6 d-none d-lg-flex justify-content-center align-items-center position-relative"
            id="colLogo"
          >
            <img
              src="{% static 'img/logo_aprovaifpi.svg' %}"
              alt="AprovaIFPI Logo"
              class="img-fluid img-logo"
            />

            <img
              src="{% static 'img/logo_background.svg' %}"
              alt="logo background"
              class="img-background position-absolute"
            />

            <img
              src="{% static 'img/line_background.svg' %}"
              alt="line background 1"
              class="line-background position-absolute"
              id="lineBackground1"
            />
          </div>

          <div
            class="col-12 col-lg-6"
            id="colForm"
          >
            <div class="form-container">

              {% if messages %}
                <div class="w-100 mb-3">
                  {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} d-flex align-items-center py-2 px-3 mb-2" role="alert">
                      <i class="bi bi-exclamation-circle-fill me-2 flex-shrink-0"></i>
                      <div>{{ message }}</div>
                    </div>
                  {% endfor %}
                </div>
              {% endif %}

              <img
                src="{% static 'img/full_logo.png' %}"
                alt="logo completa"
                class="full-logo img-fluid"
              />

              <div class="d-flex">
                <h4 class="fw-light">Entre em sua&nbsp;</h4>
                <h4 class="fw-bolder">conta</h4>
              </div>

              <form action="{% url 'login' %}" method="POST" novalidate>
                {% csrf_token %}

                <div class="form-group mb-3">
                  <label class="form-label">Email</label>
                  <input type="text" name="email" class="form-control"/>
                </div>

                <div class="form-group mb-2">
                  <label class="form-label">Senha</label>
                  <input type="password" name="senha" class="form-control"/>
                </div>

                <div class="text-end mb-3">
                  <a href="{% url 'recuperar_conta' %}" class="form-link small text-decoration-none">Esqueceu sua senha?</a>
                </div>

                <button type="submit" class="btn-login">Entrar</button>

                <p class="mt-2 text-sm text-center">
                  Não possui uma conta?&nbsp;
                  <a href="{% url 'cadastro' %}" class="form-link">Crie uma!</a>
                </p>
              </form>

              <div class="social-media">
                <p style="color: #b2b2b2; text-align: center">Ou entre com</p>
                <div class="social-icons d-flex justify-content-center gap-4 h4">
                  <i class="bi bi-facebook"></i>
                  <i class="bi bi-google"></i>
                  <i class="bi bi-twitter"></i>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
